<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>予想ビューア</title>
<!--
  当日予想の CSV(keiba_analysis.ml.raceday が作るもの)を、レースごとに見やすく並べるビューア。
  ブラウザでこのファイルを開き、%KEIBA_DATA_DIR%\predictions\<日付>\ の CSV(フォルダごとでもよい)を落とす。
  - ローカルCSVはブラウザ内で読む。Google Drive取得を使う場合は、公開フォルダからGoogle Drive API経由でCSVをダウンロードする。
  - 読める CSV: 予想 CSV(年月日_場名_R数.csv)、組み合わせ\ の CSV(券種・組番・確率・妥当なオッズ)、
    自信の区分ごとの回収率.csv、推奨買い目\ の CSV(予算・買い目)、オッズ\ の CSV(全券種・全組のオッズ)。
    種類は見出しの列で見分ける。
  - 単勝・複勝のオッズは、予想 CSV の列(raceday が発走 55・20・10分前に速報オッズを取って入れる)を使う(手入力はしない)。
    単勝オッズの横に人気(オッズの低い順)を出す。期待値 = オッズ ÷ 妥当オッズ(= 勝率 × オッズ)。複勝は下限のオッズで出す。
  - 「フォルダを見張る」(Chrome・Edge)で当日のフォルダを選ぶと、1分ごとに CSV を読み直す。
  - レース情報.csv(芝ダ・距離・レース名・レースの状態)があれば見出しに出す。結果 と 払戻 の CSV があるレースは、右側に結果の欄を出す。
  - 結果のあるレースは「レース回顧」(レース内容と予想との乖離)を出す。回顧 の CSV(ラップと基準)と予想・結果から作る。表示だけで、
    モデルへのフィードバックはしない。
  - ローカルのフォルダ選択では従来どおり対象フォルダを読む。Google Drive取得では、共有された predictions フォルダを起点に、配下の全階層からCSVを再帰取得する。
    1つの CSV に複数のレースが入っているもの(昔の形)は、予想 CSV として読まない。
  - ローカルのファイル・フォルダの選択状態に加え、Google Driveから取得したCSV本体もこのブラウザの中(IndexedDB)に保存する。
    再読み込み(F5)では保存済みCSVを読み込み、最新データが必要なときは「Driveから最新CSV」を押して再取得する。
-->
<link rel="stylesheet" href="./assets/css/predictions.css">
<link rel="stylesheet" href="./assets/css/predictions-mobile.css">
</head>
<body>
<header>
  <button id="navToggle" title="レース一覧を開く・たたむ" aria-label="レース一覧を開く・たたむ">☰</button>
  <h1>予想ビューア</h1>
  <span class="muted" id="status">CSV を落としてください</span>
  <span class="sp"></span>
  <button id="driveReload" title="Google Driveからデータを更新">データを更新</button>
  <button id="resOpen" title="結果の欄を開く">結果</button>
  <button id="guideBtn" title="総合・能力・適性・調子・人・展開が何を評価しているかの一覧">指標の説明</button>
  <button id="theme" title="明るさを切り替える">◐</button>
</header>
<div id="drop">
  <p style="font-size:16px;margin:0 0 8px">当日予想の CSV をここに落とす(フォルダごとでも可)</p>
  <p class="muted" style="margin:0">Googleログイン後に共有されたGoogle Driveから取得したCSVを表示します。<br>
  CSVの内容はこのブラウザ内で処理し、分析用サーバーには送信しません。</p>
  <p id="restore" hidden style="margin:16px 0 0"><button class="btn"></button></p>
</div>
<dialog id="guide" aria-labelledby="guideTitle">
  <div class="gh"><h2 id="guideTitle">指標の説明(総合・能力・適性・調子・人・展開)</h2><button id="guideClose">閉じる</button></div>
  <div class="gb" id="guideBody"></div>
</dialog>
<script type="application/json" id="catDefs">{"能力": ["走破タイム指数", "上がりの指数", "近走の着順", "近走のタイム差", "前走の着順", "前走のタイム差", "前走の上がり", "指数の最高値・伸び", "持ち時計", "重賞の成績", "対戦相手のレベル", "馬場差で補正した指数", "斤量も補正した指数・前半の速さ", "同じクラスの成績", "クラスの昇級・降級", "獲得賞金", "通算・近1年の成績", "前走のレースのレベル", "地方競馬での成績", "セリの価格", "追い上げの傾向", "前走の負け方", "馬齢", "性別", "生まれ月・日齢", "初出走"], "適性": ["同じ距離帯の成績", "同じ芝ダの成績", "同じ競馬場の成績", "回り・コースの成績", "道悪の成績", "直線の長さ・洋芝の成績", "同じ馬場状態の指数", "ベスト体重との差", "距離の延長・短縮", "父の系統", "母父の系統", "父の産駒の成績", "母父の産駒の成績", "父の産駒の2歳・新馬の成績", "母のきょうだい・いとこの成績", "母父・母母父の成績", "ニックス", "インブリード(3代)", "インブリード(5代)", "系統のニックス", "主な祖先の血量", "兄弟の成績", "ラップの傾向", "馬場の計測値(クッション値・含水率)", "距離", "芝ダ", "競馬場", "馬場状態", "季節", "天候", "開催中の天候"], "調子": ["休み明けの日数", "叩き2戦目・連闘", "調教の有無", "調教のタイム", "調教の本数", "調教の終いの伸び", "調教の自己ベストとの差", "調教の上がり", "ウッドのコース", "調教のラップ", "調教の時刻", "馬体重", "馬体重の増減", "ブリンカー", "斤量の変化"], "人": ["騎手の成績", "調教師の成績", "騎手のこの競馬場の成績", "乗り替わり", "騎手×調教師", "騎手×その馬", "馬主・生産者の成績", "調教師・騎手の新馬・2歳の成績", "見習騎手の減量", "斤量"], "展開": ["脚質", "同じレースの先行馬", "先行・内の有利", "テンの速さ", "今回の展開予想", "コーナーでの動き", "位置取りの安定", "枠番", "馬番", "頭数", "開催中の馬場傾向", "例年の同じ時期の馬場傾向", "当日・前日の馬場傾向", "開催日・仮柵・月", "開催の続き具合", "仮柵を替えてからの日数", "クラス"]}</script>
<div id="app" hidden>
  <nav id="nav"></nav>
  <main id="main"></main>
  <aside id="result"></aside>
</div>
<script src="./assets/js/predictions.js"></script>
</body>
</html>
