<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>2026年11月1日 | 予想ビューア</title>
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="stylesheet" href="../assets/css/predictions.css">
  <link rel="stylesheet" href="../assets/css/predictions-mobile.css">
  <style>
    body { min-height:0; }
    .day-page { max-width:1100px; margin:12px auto; padding:12px 16px; }
    .day-page h1 { margin:0 0 6px; }
    .day-page .day-date { color:var(--muted,#888); margin:0 0 12px; }
    .day-page .day-placeholder { min-height:0; padding:12px 16px; border:1px dashed var(--border,#8888); border-radius:12px; }
    @media (max-width:700px) { .day-page { margin:6px auto; padding:8px 10px; } }
  </style>
</head>
<body>
  <main class="day-page">
    <h1>日別ページ</h1>
    <p class="day-date" id="dayDate">日付未設定</p>
    <section class="day-placeholder" aria-label="日別ページの表示領域">
      <p>このページの表示内容は、これから追加します。</p>
    </section>
  </main>
  <script>
    (() => {
      const match = location.pathname.match(/(\d{8})\.html$/);
      const date = match ? match[1] : "";
      const label = date
        ? date.slice(0, 4) + "年" + Number(date.slice(4, 6)) + "月" + Number(date.slice(6, 8)) + "日"
        : "日付未設定";
      document.getElementById("dayDate").textContent = label;
      if (date) document.title = label + " | 予想ビューア";
      if (window.parent !== window) {
        const sendHeight = () => window.parent.postMessage({type: "day-page-height", height: document.documentElement.scrollHeight}, location.origin);
        new ResizeObserver(sendHeight).observe(document.documentElement);
        window.addEventListener("load", sendHeight);
        sendHeight();
      }
    })();
  </script>
</body>
</html>
