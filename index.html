<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Predictions Viewer</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="stylesheet" href="./assets/css/login.css">
</head>
<body>
<main>
  <h1>Predictions Viewer</h1>
  <p>Googleアカウントでログインすると、データを取得して予想・分析画面を開きます。取得には2〜3分ほどかかる場合があります。</p>
  <button id="login" disabled>Googleでログインしてデータを取得</button>
  <div id="status" class="status" role="status" aria-live="polite">Google認証の準備中…</div>
  <p class="small">データの取得には、管理者から共有されたGoogleアカウントを使用してください。取得したデータはこのブラウザ内で処理します。</p>
</main>
<script src="./assets/js/login.js"></script>
</body>
</html>
